name: Keep Alive

on:
  schedule:
    # GitHub Actions n'accepte pas un intervalle de 4 minutes (le minimum
    # pratique est 5 minutes). "*/5 * * * *" = toutes les 5 minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch: # permet de déclencher manuellement depuis l'onglet Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping target URL
        run: |
          echo "Ping vers ${{ secrets.TARGET_URL }}"
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" --max-time 90 --retry 1 --retry-delay 5 "${{ secrets.TARGET_URL }}"
